<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dungeon Relic - 던전 RPG</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b12;color:#eee;font-family:Arial,"Malgun Gothic",sans-serif;overflow:hidden}
#wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
canvas{background:#10131d;border:2px solid #31384b;box-shadow:0 0 40px #000;max-width:100vw;max-height:100vh}
#help{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:13px;color:#9ea7bd;pointer-events:none}

#touchUI{display:none;position:fixed;inset:0;pointer-events:none;touch-action:none;z-index:1000}
.touchBtn{position:absolute;z-index:1001;pointer-events:auto;border:2px solid rgba(255,255,255,.35);background:rgba(20,25,40,.72);color:#fff;border-radius:50%;font-weight:bold;user-select:none;-webkit-user-select:none;touch-action:none;display:flex;align-items:center;justify-content:center}
#joy{left:22px;bottom:28px;width:125px;height:125px;border-radius:50%;font-size:12px;color:#aeb8ce}
#joyKnob{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(110,140,255,.65);border:2px solid #fff;left:34px;top:34px;pointer-events:none}
#attackBtn{right:24px;bottom:42px;width:92px;height:92px;background:rgba(180,55,55,.72);font-size:17px}
.skillBtn{width:58px;height:58px;bottom:145px;font-size:18px}
#skill1{right:190px}#skill2{right:122px}#skill3{right:54px}
#townBtn{right:24px;top:24px;width:58px;height:58px;font-size:13px}
#nextBtn{right:24px;bottom:150px;width:76px;height:54px;border-radius:18px;font-size:13px}
#touchHint{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);font-size:11px;color:#aeb8ce;white-space:nowrap;pointer-events:none}
@media (max-width:700px){#touchUI{display:block}#help{display:none}canvas{width:100vw;height:auto;max-width:100vw;max-height:100vh;border-width:1px}}
canvas{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;position:relative;z-index:1}\n@media (pointer:coarse){.touchBtn{touch-action:none!important}.touchBtn:active{transform:scale(.94)}}\n</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1200" height="720"></canvas><div id="help">WASD 이동 · 마우스 공격 · 1/2/3 스킬 · G 아이템 줍기 · I 인벤토리 · B 상점 · H 마을 · → 다음 방</div></div><div id="touchUI">
  <div id="joy" class="touchBtn">이동<div id="joyKnob"></div></div>
  <div id="attackBtn" class="touchBtn">공격</div>
  <div id="skill1" class="touchBtn skillBtn">1</div>
  <div id="skill2" class="touchBtn skillBtn">2</div>
  <div id="skill3" class="touchBtn skillBtn">3</div>
  <div id="townBtn" class="touchBtn">마을</div>
  <div id="nextBtn" class="touchBtn">다음 ▶</div>
  <div id="touchHint">화면을 가로로 돌리면 더 편하게 플레이할 수 있어요</div>
</div>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
const W=c.width,H=c.height;
const keys={},mouse={x:600,y:360,down:false};
let controlMode="pc";
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(["1","2","3"].includes(e.key)) skill(+e.key);if(e.key.toLowerCase()==="i"){inv=!inv;shop=false}
if(e.key.toLowerCase()==="b"){shop=!shop;inv=false}
if(e.key==="Escape"){inv=false;shop=false}
if(e.key.toLowerCase()==="g" && state==="game" && player && !inv && !shop) pickupNearbyDrop();
if(e.key==="Enter"&&state==="title")startGame();
if(e.key==="Enter"&&state==="town"){
  town=false;
  state="game";
  if(resumeRoom && room>0){
    resumeRoom=false;
    spawnCurrentRoom();
  }else{
    nextRoom();
  }
}
if(e.key.toLowerCase()==="h" && state==="game"){
  resumeRoom=true;
  town=true; state="town"; enemies=[];bullets=[];effects=[];
  roomCleared=false;awaitingNext=false; player.hp=player.maxhp;player.mp=player.maxmp;
  msg="마을로 복귀했습니다";msgT=1.5;
}
if(e.key==="ArrowRight" && state==="game" && roomCleared && !inv && !shop){
  if(finalBoss){finalBoss=false;roomCleared=false;awaitingNext=false;state="victory";}
  else nextRoom();
}});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
c.addEventListener("mousemove",e=>{const r=c.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height});
c.addEventListener("mousedown",()=>mouse.down=true);
addEventListener("mouseup",()=>mouse.down=false);

// 제목 화면은 일반 클릭으로도 확실하게 처리
c.addEventListener("click",e=>{
  if(state!=="title") return;
  const r=c.getBoundingClientRect();
  mouse.x=(e.clientX-r.left)*W/r.width;
  mouse.y=(e.clientY-r.top)*H/r.height;
  mouse.down=true;
  handleModeClick();
  mouse.down=false;
});

// 모바일 터치 조작
const touchUI=document.getElementById("touchUI"),joy=document.getElementById("joy"),knob=document.getElementById("joyKnob");
const touchState={active:false,id:null,x:0,y:0,joyX:0,joyY:0,attack:false};
let joyId=null,joyDX=0,joyDY=0;
function touchPoint(t){
  const r=c.getBoundingClientRect();
  return {x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height};
}
function setMouseFromPoint(p){mouse.x=p.x;mouse.y=p.y;}
function pressAction(el,fn){
  el.addEventListener("touchstart",e=>{e.preventDefault();fn(e)},{passive:false});
  el.addEventListener("pointerdown",e=>{if(e.pointerType!=="touch") return;e.preventDefault();fn(e);},{passive:false});
}

pressAction(document.getElementById("attackBtn"),e=>{
  if(state==="game"&&!inv&&!shop){touchState.attack=true;mouse.down=true;}
});
document.getElementById("attackBtn").addEventListener("touchend",e=>{e.preventDefault();touchState.attack=false;mouse.down=false},{passive:false});
document.getElementById("attackBtn").addEventListener("touchcancel",e=>{e.preventDefault();touchState.attack=false;mouse.down=false},{passive:false});

pressAction(document.getElementById("skill1"),()=>{if(state==="game")skill(1)});
pressAction(document.getElementById("skill2"),()=>{if(state==="game")skill(2)});
pressAction(document.getElementById("skill3"),()=>{if(state==="game")skill(3)});
pressAction(document.getElementById("townBtn"),()=>{
  if(state==="game"){resumeRoom=true;town=true;state="town";enemies=[];bullets=[];effects=[];roomCleared=false;awaitingNext=false;if(player){player.hp=player.maxhp;player.mp=player.maxmp;}}
});
pressAction(document.getElementById("nextBtn"),()=>{
  if(state==="game"&&roomCleared&&!inv&&!shop){
    if(finalBoss){finalBoss=false;roomCleared=false;awaitingNext=false;state="victory"}
    else nextRoom();
  }
});


// 모바일 브라우저 호환용: 터치 버튼은 Pointer Events로도 동작
for(const id of ["attackBtn","skill1","skill2","skill3","townBtn","nextBtn"]){
  const el=document.getElementById(id);
  el.addEventListener("contextmenu",e=>e.preventDefault());
}

joy.addEventListener("touchstart",e=>{
  e.preventDefault();
  if(state!=="game"||controlMode!=="mobile") return;
  const t=e.changedTouches[0];
  joyId=t.identifier;
  touchState.active=true;
  updateJoy(t);
},{passive:false});
joy.addEventListener("touchmove",e=>{
  e.preventDefault();
  for(const t of e.changedTouches) if(t.identifier===joyId) updateJoy(t);
},{passive:false});
joy.addEventListener("touchend",e=>{
  e.preventDefault();
  for(const t of e.changedTouches) if(t.identifier===joyId){
    joyId=null;touchState.active=false;touchState.joyX=touchState.joyY=0;joyDX=joyDY=0;knob.style.left="34px";knob.style.top="34px";
  }
},{passive:false});
function updateJoy(t){
  const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=t.clientX-cx,dy=t.clientY-cy;
  const max=42,d=Math.hypot(dx,dy);
  if(d>max){dx=dx/d*max;dy=dy/d*max}
  joyDX=dx/max;joyDY=dy/max;
  touchState.joyX=joyDX;touchState.joyY=joyDY;
  knob.style.left=(34+dx)+"px";knob.style.top=(34+dy)+"px";
}

// 캔버스 터치: 제목/마을/상점 클릭 지원
c.addEventListener("touchend",e=>{
  if(e.target!==c) return;
  e.preventDefault();
  const t=e.changedTouches[0],p=touchPoint(t);
  mouse.x=p.x;mouse.y=p.y;
  if(state==="title"){
    mouse.down=true;
    handleModeClick();
  }
  mouse.down=false;
},{passive:false});
c.addEventListener("pointerup",e=>{
  if(e.pointerType!=="touch" || state!=="title") return;
  const r=c.getBoundingClientRect();
  mouse.x=(e.clientX-r.left)*W/r.width;
  mouse.y=(e.clientY-r.top)*H/r.height;
  mouse.down=true;
  handleModeClick();
  mouse.down=false;
},{passive:false});


const weapons=[
{name:"낡은 단검",type:"dagger",grade:"일반",color:"#aeb5c0",base:13,crit:.12,speed:210,skills:["빠른 베기","단검 투척","급소 찌르기"],desc:"빠르고 안정적인 근접 무기"},
{name:"철검",type:"sword",grade:"일반",color:"#c5ccd8",base:16,crit:.08,speed:250,skills:["검풍","돌진 베기","연속 참격"],desc:"균형 잡힌 기본 검"},
{name:"사냥꾼의 활",type:"bow",grade:"일반",color:"#b8a078",base:14,crit:.13,speed:190,skills:["정밀 사격","산탄 화살","뒤로 물러서기"],desc:"빠른 원거리 공격"},
{name:"초보자 지팡이",type:"staff",grade:"일반",color:"#c6a3ff",base:12,crit:.06,speed:270,skills:["마력탄","마나 폭발","회복 마법"],desc:"마법 입문용 지팡이"},

{name:"서리 단검",type:"dagger",grade:"희귀",color:"#4fa8ff",base:21,crit:.18,speed:185,skills:["빙결 연격","얼음 돌진","서리 처형"],desc:"적을 느리게 만드는 단검"},
{name:"화염 장검",type:"sword",grade:"희귀",color:"#4fa8ff",base:25,crit:.10,speed:260,skills:["화염 베기","불꽃 돌진","폭염 참격"],desc:"공격에 화염을 두른 검"},
{name:"천둥 활",type:"bow",grade:"희귀",color:"#4fa8ff",base:23,crit:.20,speed:165,skills:["번개 화살","연쇄 사격","천둥비"],desc:"번개처럼 빠른 활"},
{name:"수정 마법서",type:"staff",grade:"희귀",color:"#4fa8ff",base:22,crit:.08,speed:250,skills:["수정탄","마력 폭발","보호막"],desc:"마력을 증폭하는 마법서"},

{name:"그림자 쌍검",type:"dagger",grade:"영웅",color:"#b86cff",base:30,crit:.24,speed:145,skills:["그림자 연무","암살 돌진","백어택 폭풍"],desc:"치명타에 특화된 쌍검"},
{name:"빙결 대검",type:"greatsword",grade:"영웅",color:"#b86cff",base:38,crit:.11,speed:440,skills:["빙결 베기","얼음 파동","빙산 참격"],desc:"넓은 범위와 둔화를 가진 대검"},
{name:"유령 장궁",type:"bow",grade:"영웅",color:"#b86cff",base:34,crit:.27,speed:145,skills:["유령 화살","관통 폭우","환영 사격"],desc:"화살이 적을 관통하는 장궁"},
{name:"별빛 지팡이",type:"staff",grade:"영웅",color:"#b86cff",base:32,crit:.10,speed:230,skills:["별빛 탄환","유성 폭발","별의 보호"],desc:"강력한 광역 마법 지팡이"},

{name:"용암 쌍검",type:"dagger",grade:"전설",color:"#ff9d35",base:42,crit:.28,speed:125,skills:["용암 난무","화염 암살","지옥의 칼날"],desc:"극도로 빠른 화염 쌍검"},
{name:"용의 대검",type:"greatsword",grade:"전설",color:"#ff9d35",base:55,crit:.14,speed:470,skills:["용염 베기","용의 포효","화룡 폭발"],desc:"용의 힘을 담은 대검"},
{name:"천공의 활",type:"bow",grade:"전설",color:"#ff9d35",base:47,crit:.32,speed:120,skills:["천공 관통","별똥별 사격","천공의 비"],desc:"하늘을 가르는 전설의 활"},
{name:"태양의 지팡이",type:"staff",grade:"전설",color:"#ff9d35",base:49,crit:.13,speed:210,skills:["태양탄","태양 폭발","태양의 심판"],desc:"강력한 화염 마법 지팡이"},

{name:"죽음의 쌍낫",type:"scythe",grade:"신화",color:"#ff3d81",base:110,crit:.40,speed:105,skills:["영혼 수확","사신의 춤","죽음의 표식"],desc:"압도적인 공격력과 치명타를 가진 신화 무기"},
{name:"세계수의 대검",type:"greatsword",grade:"신화",color:"#ff3d81",base:140,crit:.22,speed:520,skills:["대지 절단","세계수 강림","멸망의 참격"],desc:"압도적인 한 방을 자랑하는 신화 대검"},
{name:"신궁 아르테미스",type:"bow",grade:"신화",color:"#ff3d81",base:125,crit:.48,speed:95,skills:["신속 화살","달빛 폭우","신궁의 일격"],desc:"최고의 치명타와 공격력을 자랑하는 신화 활"},
{name:"창세의 마도서",type:"staff",grade:"신화",color:"#ff3d81",base:130,crit:.22,speed:185,skills:["창세의 탄환","차원 폭발","메테오 아포칼립스"],desc:"던전 최강급 공격력을 가진 신화 마법서"}
];
const gradeRank={"일반":1,"희귀":2,"영웅":3,"전설":4,"신화":5};
let state="title",inv=false,paused=false,last=0,shake=0,msg="",msgT=0;
let player,enemies=[],bullets=[],effects=[],drops=[],texts=[],floor=1,room=0,totalRooms=600,gold=80;
let currentWeapon=weapons[0],owned=[weapons[0]],cool=[0,0,0],attackCD=0,spawnTimer=0;
let shop=false, town=false, finalBoss=false, roomCleared=false, awaitingNext=false, resumeRoom=false, shopTab="weapon", shopWeapons=[], shopArmors=[], stockCost=25, armor={name:"낡은 가죽 갑옷",grade:"일반",def:2,hp:0,color:"#aeb5c0",price:0};
let armorList=[
 {name:"낡은 가죽 갑옷",grade:"일반",def:2,hp:0,color:"#aeb5c0",price:0},
 {name:"강철 갑옷",grade:"희귀",def:7,hp:25,color:"#4fa8ff",price:180},
 {name:"마법사의 로브",grade:"영웅",def:10,hp:45,color:"#b86cff",price:360},
 {name:"용비늘 갑옷",grade:"전설",def:16,hp:80,color:"#ff9d35",price:650},
 {name:"심연의 갑주",grade:"신화",def:24,hp:130,color:"#ff3d81",price:1100}
];
let dungeonThemes=[
 {name:"잊힌 지하묘지",floor:"#151a29",wall:"#31394c",accent:"#f2b84b"},
 {name:"얼어붙은 동굴",floor:"#10202b",wall:"#31505e",accent:"#8de8ff"},
 {name:"마그마 성채",floor:"#251713",wall:"#5b3428",accent:"#ff7545"},
 {name:"심연의 왕좌",floor:"#211325",wall:"#55305e",accent:"#ff3d81"}
];


function chooseMode(mode){
  controlMode=mode;
  state="title";
  modeSelected=true;
  msg=mode==="mobile"?"모바일 모드 선택":"PC 모드 선택";
  msgT=1.5;
}
function modeButton(x,y,w,h,label,sub,mode){
  panel(x,y,w,h,controlMode===mode && modeSelected?"#263653":"#171d2b");
  ctx.textAlign="center";
  ctx.fillStyle="#fff";
  ctx.font="bold 26px Arial";
  ctx.fillText(label,x+w/2,y+48);
  ctx.fillStyle="#9eabc2";
  ctx.font="14px Arial";
  ctx.fillText(sub,x+w/2,y+78);
}
let modeSelected=false;

function handleModeClick(){
  if(!mouse.down || state!=="title") return false;

  if(mouse.x>=210&&mouse.x<=590&&mouse.y>=315&&mouse.y<=475){
    controlMode="pc";
    modeSelected=true;
    mouse.down=false;
    return true;
  }

  if(mouse.x>=610&&mouse.x<=990&&mouse.y>=315&&mouse.y<=475){
    controlMode="mobile";
    modeSelected=true;
    mouse.down=false;
    return true;
  }

  if(modeSelected && mouse.x>=400&&mouse.x<=800&&mouse.y>=500&&mouse.y<=590){
    mouse.down=false;
    startGame();
    return true;
  }
  return false;
}

function startGame(){
 state="game"; floor=1;room=0;gold=120; town=false; resumeRoom=false; shop=false; finalBoss=false; roomCleared=false; awaitingNext=false;owned=[weapons[0]];currentWeapon=weapons[0];
 player={x:300,y:360,r:18,hp:120,maxhp:120,mp:100,maxmp:100,lvl:1,xp:0,next:100,atk:4,def:3,speed:210,inv:0,coins:0};
 refreshStock(true);
 enemies=[];bullets=[];effects=[];drops=[];texts=[];nextRoom();
}
function spawnCurrentRoom(){
  enemies=[];bullets=[];effects=[];drops=[];spawnTimer=0;
  roomCleared=false;awaitingNext=false;finalBoss=false;
  const count=Math.max(1,Math.min(12,3+floor*2+room));
  for(let i=0;i<count;i++) spawnEnemy();
  if(enemies.length===0) spawnEnemy();
  msg=`${floor}층 · ${room}/${totalRooms} 방`;msgT=1.5;
}
function nextRoom(){
 resumeRoom=false;
 room++;
 enemies=[];bullets=[];effects=[];drops=[];spawnTimer=0;
 roomCleared=false; awaitingNext=false;

 if(room>totalRooms){
   if(floor<4){
     floor++; room=0; town=true; resumeRoom=false; state="town";
     player.hp=player.maxhp; player.mp=player.maxmp;
     msg=`${floor}층 준비 완료! 마을에서 장비를 정비하세요`;msgT=2;
     return;
   }else{
     finalBoss=true; state="game"; spawnBoss(); return;
   }
 }
 finalBoss=false;
 const count=Math.max(1,Math.min(12,3+floor*2+room));
 for(let i=0;i<count;i++) spawnEnemy();
 if(enemies.length===0) spawnEnemy();
 msg=`${floor}층 · ${room}/${totalRooms} 방`;msgT=1.5;
}
function spawnEnemy(){
 const types=["슬라임","고블린","해골","오크","마법사","박쥐","기사","골렘"];
 let t=types[Math.floor(Math.random()*types.length)];
 let mult=1+floor*.35+room*.09;
 let atkMult=1+floor*.45+room*.11;
 const stats={
  "슬라임":[26,5,45,20],
  "고블린":[38,8,65,28],
  "해골":[48,11,70,34],
  "오크":[82,16,48,55],
  "마법사":[42,7,42,48],
  "박쥐":[30,6,110,25],
  "기사":[105,20,38,80],
  "골렘":[160,24,28,110]
 };
 const data=stats[t];
 const r=(t==="오크"||t==="기사")?24:(t==="골렘"?30:18);
 enemies.push({
   type:t,
   x:760+Math.random()*320,
   y:100+Math.random()*520,
   r,
   hp:data[0]*mult,
   maxhp:data[0]*mult,
   atk:data[1]*atkMult,
   speed:data[2],
   xp:data[3]*mult,
   hit:0,
   shoot:1+Math.random()*2
 });
}
function spawnBoss(){
 finalBoss=true;
 enemies=[{type:"던전 군주",x:880,y:360,r:55,hp:900+floor*300,maxhp:900+floor*300,atk:30+floor*5,speed:55,xp:500,hit:0,shoot:1}];
 msg="BOSS · 던전 군주";msgT=3;
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

function refreshStock(first=false){
 // 일반 재입고는 비용을 먼저 확인한다.
 // 골드가 부족하면 진열 상품도 절대 바뀌지 않는다.
 if(!first && (Number(gold) < 25 || !Number.isFinite(Number(gold)))){
   msg=`골드가 부족합니다. 재입고에는 ◆ 25가 필요합니다`;
   msgT=1.3;
   return false;
 }
 if(!first) stockCost=25;
 const pool=[...weapons];
 // 가중치: 높은 등급일수록 조금 더 희귀
 function pick(list,n){
   let out=[];
   while(out.length<n && list.length){
     let weights=list.map(w=>{
     const r=gradeRank[w.grade];
     return r===1?55:r===2?28:r===3?10:r===4?2:0.05;
   });
     let total=weights.reduce((a,b)=>a+b,0), r=Math.random()*total, idx=0;
     for(let i=0;i<weights.length;i++){r-=weights[i];if(r<=0){idx=i;break}}
     out.push(list.splice(idx,1)[0]);
   }
   return out;
 }
 shopWeapons=pick(pool,Math.min(4,pool.length));
 const ap=[...armorList.slice(1)];
 shopArmors=pick(ap,Math.min(4,ap.length));
 if(!first){
   gold-=stockCost;
   msg="상점 재입고 완료!";
   msgT=1.5;
 }
 return true;
}
function buyWeapon(w){
 const price=w.base*gradeRank[w.grade]*6;
 if(owned.includes(w)){
   currentWeapon=w;
   msg=`${w.name} 장착!`;
   msgT=1.2;
   return;
 }
 if(gold<price){
   msg="골드가 부족해!";
   msgT=1;
   return;
 }
 gold-=price;
 owned.push(w);
 currentWeapon=w;
 cool=[0,0,0];
 attackCD=0;
 msg=`${w.name} 구매 및 장착!`;
 msgT=1.5;
}

 gold-=a.price;armor=a;player.maxhp=120+player.lvl*18+a.hp;player.hp=Math.min(player.maxhp,player.hp+a.hp);

function pickupNearbyDrop(){
  if(!player || !drops.length) return false;

  let target=null;
  let best=48;

  for(const d of drops){
    if(d.dead) continue;
    const dd=dist(player,d);
    if(dd<=best){
      best=dd;
      target=d;
    }
  }

  if(!target){
    msg="아이템 가까이에서 G를 눌러주세요";
    msgT=0.9;

  }

  useDrop(target);

}

 touchUI.style.display=(controlMode==="mobile" && state!=="title")?"block":"none";

 if(controlMode==="mobile" && state==="game" && touchState.attack && enemies.length && player){
   let target=enemies.reduce((a,b)=>dist(player,a)<dist(player,b)?a:b);

 }
 if(controlMode==="mobile" && state==="game" && player && touchState.active){
   const sp=player.speed;

   player.y+=touchState.joyY*sp*dt;

   player.y=clamp(player.y,70,H-80);
 }

 if(state==="town"){handleTownClick();return;}
 if(state!=="game")return;
 if(inv||paused)return;
 player.inv=Math.max(0,player.inv-dt);attackCD=Math.max(0,attackCD-dt);
 for(let i=0;i<3;i++)cool[i]=Math.max(0,cool[i]-dt);
 player.mp=Math.min(player.maxmp,player.mp+8*dt);
 let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0); if(joyId!==null){dx=joyDX;dy=joyDY;}
 if(dx||dy){let l=Math.hypot(dx,dy);player.x+=dx/l*player.speed*dt;player.y+=dy/l*player.speed*dt}
 player.x=clamp(player.x,28,1172);player.y=clamp(player.y,78,650);
 if(mouse.down)attack();

 bullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
  enemies.forEach(e=>{if(b.life>0&&dist(b,e)<e.r+8){hitEnemy(e,b.dmg);b.life=0;if(b.slow)e.slow=b.slow}})
 });
 bullets=bullets.filter(b=>b.life>0&&b.x>-30&&b.x<W+30&&b.y>-30&&b.y<H+30);
 enemies.forEach(e=>{
  e.hit=Math.max(0,e.hit-dt);e.slow=Math.max(0,(e.slow||0)-dt);e.mark=Math.max(0,(e.mark||0)-dt);
  let d=dist(player,e);
  let sp=e.speed*(e.slow?0.45:1);
  if(e.type==="마법사"||e.type==="던전 군주"){
   if(d>270){e.x+=(player.x-e.x)/d*sp*dt;e.y+=(player.y-e.y)/d*sp*dt}
   e.shoot-=dt;
   if(e.shoot<=0){e.shoot=e.type==="던전 군주"?1.3:2.2;let a=Math.atan2(player.y-e.y,player.x-e.x);bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*260,vy:Math.sin(a)*260,dmg:e.atk*.65,life:3,type:"enemy"})}
  }else if(d>e.r+player.r+5){e.x+=(player.x-e.x)/d*sp*dt;e.y+=(player.y-e.y)/d*sp*dt}
  else if(player.inv<=0){player.hp-=Math.max(1,e.atk-player.def-armor.def)*dt;player.inv=.05}
 });
 bullets.forEach(b=>{if(b.type==="enemy"&&dist(b,player)<player.r+7&&player.inv<=0){player.hp-=Math.max(1,b.dmg-player.def*.35-armor.def*.35);player.inv=.3;b.life=0;shake=7}});
 bullets=bullets.filter(b=>b.life>0);
 enemies=enemies.filter(e=>e.hp>0);
 drops=drops.filter(d=>!d.dead);
 texts.forEach(t=>t.t-=dt);texts=texts.filter(t=>t.t>0);
 effects.forEach(e=>e.t-=dt);effects=effects.filter(e=>e.t>0);
 if(player.hp<=0){state="gameover";return}
 if(enemies.length===0 && state==="game" && !roomCleared && !finalBoss){
   roomCleared=true; awaitingNext=true;
   msg=room>=totalRooms ? "던전 클리어! 필요한 아이템을 G로 줍고 → 를 눌러 다음 층으로" : "방 클리어! 아이템을 줍고 → 를 누르세요";
   msgT=3;
 }
}

 ctx.fillStyle="#aeb6c9";ctx.font="14px Arial";ctx.textAlign="right";ctx.fillText(`FLOOR ${floor}  ·  ROOM ${Math.min(room,totalRooms)}/${totalRooms}`,1170,52);
ctx.fillStyle="#9aa5ba";ctx.font="12px Arial";ctx.fillText(`방어 ${player.def+armor.def} · 갑옷 ${armor.name} · B 상점 · H 마을`,1170,67);
 if(roomCleared && state==="game"){
   ctx.fillStyle="#f1c75b";ctx.font="bold 18px Arial";ctx.textAlign="center";
   ctx.fillText(finalBoss ? "아이템을 모두 줍고 → 를 눌러 클리어" : "아이템을 모두 줍고 → 를 눌러 다음 방으로",600,610);
 }
}
function bar(x,y,w,h,p,col,label){ctx.fillStyle="#080a10";ctx.fillRect(x,y,w,h);ctx.fillStyle=col;ctx.fillRect(x,y,w*clamp(p,0,1),h);ctx.fillStyle="#fff";ctx.font="10px Arial";ctx.textAlign="center";ctx.fillText(label,x+w/2,y+h-3)}
function panel(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h);ctx.strokeStyle="#343c50";ctx.strokeRect(x,y,w,h)}
function drawInventory(){
 ctx.fillStyle="rgba(3,5,10,.86)";ctx.fillRect(0,0,W,H);
 panel(120,75,960,570,"#101521");
 ctx.fillStyle="#fff";ctx.font="bold 28px Arial";ctx.textAlign="left";ctx.fillText("INVENTORY",155,115);
 ctx.font="14px Arial";ctx.fillStyle="#8e98ad";ctx.fillText("무기를 클릭해서 장착 · ESC로 닫기",155,138);
 owned.forEach((w,i)=>{
  let x=155+(i%3)*285,y=165+Math.floor(i/3)*170;
  panel(x,y,255,145,w===currentWeapon?"#202b45":"#171c29");
  ctx.fillStyle=w.color;ctx.font="bold 19px Arial";ctx.fillText(w.name,x+18,y+30);
  ctx.fillStyle="#fff";ctx.font="13px Arial";ctx.fillText(w.grade,x+18,y+52);
  ctx.fillStyle="#aeb6c7";ctx.fillText(`공격력 +${w.base}  치명타 ${Math.floor(w.crit*100)}%`,x+18,y+75);
  ctx.fillText(w.desc,x+18,y+97);ctx.fillStyle=w.color;ctx.fillText("스킬: "+w.skills.join(" / "),x+18,y+120);
  if(w===currentWeapon){ctx.fillStyle="#69e2a1";ctx.fillText("EQUIPPED",x+170,y+30)}
  else{ctx.fillStyle="#fff";ctx.fillText("클릭해서 장착",x+150,y+125)}
 });
 // click detection
 if(mouse.down){owned.forEach((w,i)=>{let x=155+(i%3)*285,y=165+Math.floor(i/3)*170;if(mouse.x>x&&mouse.x<x+255&&mouse.y>y&&mouse.y<y+145){equip(w);mouse.down=false}})}
}


function handleTownClick(){
 if(!mouse.down) return;
 // 대장간: 방어구 정비
 if(mouse.x>=170&&mouse.x<=420&&mouse.y>=225&&mouse.y<=445){
   shop=true;shopTab="armor";town=false;mouse.down=false;return;
 }
 // 장비 상점
 if(mouse.x>=475&&mouse.x<=725&&mouse.y>=225&&mouse.y<=445){
   shop=true;shopTab="weapon";town=false;mouse.down=false;return;
 }
 // 던전 입구
 if(mouse.x>=780&&mouse.x<=1030&&mouse.y>=225&&mouse.y<=445){
   town=false;
   state="game";
   if(room>0){
     resumeRoom=false;
     spawnCurrentRoom();
   }else{
     nextRoom();
   }
   mouse.down=false;
   return;
 }
}
function drawTown(){
 ctx.fillStyle="rgba(6,8,13,.96)";ctx.fillRect(0,0,W,H);
 ctx.textAlign="center";ctx.fillStyle="#f2d28b";ctx.font="bold 48px Arial";ctx.fillText("모험가의 마을",600,125);
 ctx.fillStyle="#aab3c8";ctx.font="17px Arial";ctx.fillText(`현재 골드 ◆ ${gold}   ·   B: 상점`,600,160);
 // buildings
 panel(170,225,250,220,"#172032");panel(475,225,250,220,"#1d2030");panel(780,225,250,220,"#201a2c");
 ctx.fillStyle="#fff";ctx.font="bold 24px Arial";ctx.fillText("⚒ 대장간",295,275);ctx.fillText("✦ 장비 상점",600,275);ctx.fillText("☠ 던전 입구",905,275);
 ctx.font="12px Arial";ctx.fillStyle="#6fe0a2";ctx.fillText("클릭",295,415);ctx.fillText("클릭",600,415);ctx.fillText("클릭",905,415);
 ctx.fillStyle="#8f9ab0";ctx.font="14px Arial";
 ctx.fillText("방어구 정비",295,310);ctx.fillText("무기·방어구·물약",600,310);ctx.fillText("다음 층으로 출발",905,310);
 ctx.fillStyle="#fff";ctx.font="bold 17px Arial";ctx.fillText("ENTER: 던전 출발",600,535);
}
function drawShop(){
 ctx.fillStyle="rgba(3,5,10,.94)";ctx.fillRect(0,0,W,H);
 panel(80,55,1040,610,"#101521");
 ctx.textAlign="left";ctx.fillStyle="#fff";ctx.font="bold 30px Arial";ctx.fillText("✦ 모험가 상점",115,100);
 ctx.fillStyle="#f1c75b";ctx.font="bold 18px Arial";ctx.fillText("◆ "+gold,970,100);
 ctx.fillStyle=Number(gold)>=25?"#fff":"#777f91";
 ctx.font="bold 13px Arial";
 ctx.fillText(`↻ 재입고 ◆ 25`,820,145);
 // tabs
 const tabs=[["weapon","무기"],["armor","방어구"],["potion","물약"]];
 tabs.forEach((t,i)=>{let x=115+i*145;panel(x,125,130,42,shopTab===t[0]?"#263452":"#171d2a");ctx.fillStyle="#fff";ctx.font="bold 15px Arial";ctx.fillText(t[1],x+43,151)});
 if(shopTab==="weapon"){
  shopWeapons.forEach((w,i)=>{
   let x=115+(i%2)*490,y=190+Math.floor(i/2)*125;
   panel(x,y,455,105,"#171c29");
   ctx.fillStyle=w.color;ctx.font="bold 18px Arial";ctx.fillText(w.name+" ["+w.grade+"]",x+18,y+28);
   ctx.fillStyle="#aeb6c7";ctx.font="13px Arial";ctx.fillText(`공격 ${w.base} · 치명타 ${Math.floor(w.crit*100)}% · ${w.desc}`,x+18,y+51);
   ctx.fillStyle=w.color;ctx.fillText("스킬: "+w.skills.join(" / "),x+18,y+73);
   ctx.fillStyle="#f1c75b";ctx.fillText(owned.includes(w)?"보유":`◆ ${w.base*gradeRank[w.grade]*6}`,x+350,y+29);
   ctx.fillStyle="#fff";ctx.fillText("클릭해서 구매",x+330,y+78);
  });
 } else if(shopTab==="armor"){
  shopArmors.forEach((a,i)=>{
   let x=115+(i%2)*490,y=190+Math.floor(i/2)*125;
   panel(x,y,455,105,"#171c29");ctx.fillStyle=a.color;ctx.font="bold 18px Arial";ctx.fillText(a.name+" ["+a.grade+"]",x+18,y+28);
   ctx.fillStyle="#aeb6c7";ctx.font="13px Arial";ctx.fillText(`방어 +${a.def} · 최대 HP +${a.hp}`,x+18,y+54);
   ctx.fillStyle="#f1c75b";ctx.fillText(a===armor?"장착중":`◆ ${a.price}`,x+350,y+29);
  });
 } else {
  ctx.fillStyle="#fff";ctx.font="bold 23px Arial";ctx.fillText("회복 물약",150,220);
  ctx.fillStyle="#aeb6c7";ctx.font="15px Arial";ctx.fillText("HP +70 / MP +45",150,250);
  ctx.fillStyle="#f1c75b";ctx.fillText("◆ 35",150,280);
 }
 ctx.fillStyle="#8993aa";ctx.font="13px Arial";ctx.fillText("B 또는 ESC: 닫기 · 재입고하면 20종 중 랜덤 4종이 진열됩니다",115,630);
 // mouse actions
 if(mouse.down){
   // 재입고 버튼
   if(mouse.x>800&&mouse.x<1110&&mouse.y>120&&mouse.y<170){
     if(Number(gold)>=25){
       refreshStock(false);
     }else{
       msg=`골드가 부족합니다. ◆ 25 필요`;
       msgT=1.3;
     }
     mouse.down=false;
   }
   // tabs
   tabs.forEach((t,i)=>{let x=115+i*145;if(mouse.x>x&&mouse.x<x+130&&mouse.y>125&&mouse.y<167){shopTab=t[0];mouse.down=false}});
   if(shopTab==="weapon"){
    shopWeapons.forEach((w,i)=>{let x=115+(i%2)*490,y=190+Math.floor(i/2)*125;if(mouse.x>x&&mouse.x<x+455&&mouse.y>y&&mouse.y<y+105){buyWeapon(w);mouse.down=false}})
   }else if(shopTab==="armor"){
    shopArmors.forEach((a,i)=>{let x=115+(i%2)*490,y=190+Math.floor(i/2)*125;if(mouse.x>x&&mouse.x<x+455&&mouse.y>y&&mouse.y<y+105){buyArmor(a);mouse.down=false}})
   }else if(shopTab==="potion"&&mouse.x>130&&mouse.x<600&&mouse.y>190&&mouse.y<320){buyPotion();mouse.down=false}
 }
}

  ctx.fillStyle="#090b12";ctx.fillRect(0,0,W,H);

  if(modeSelected){
    ctx.fillStyle="#69e2a1";ctx.font="bold 18px Arial";

    panel(400,510,400,70,"#263653");
    ctx.fillStyle="#fff";ctx.font="bold 21px Arial";

  }
}
function overlay(title,sub){
 ctx.fillStyle="rgba(3,4,8,.82)";ctx.fillRect(0,0,W,H);ctx.textAlign="center";
 ctx.fillStyle=title.includes("CLEAR")?"#ffd75c":"#ff5570";ctx.font="bold 58px Arial";ctx.fillText(title,600,285);
 ctx.fillStyle="#fff";ctx.font="20px Arial";ctx.fillText(sub,600,335);
}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
